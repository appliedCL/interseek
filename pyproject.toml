[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interseek"
version = "0.3.0"
description = "Paired protein learning with pretrained and random ESM-2 baselines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Reece Palmer"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.3,<3", "transformers>=4.46,<6", "numpy>=1.24,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
benchmark = ["psutil>=5.9,<8"]

[project.scripts]
interseek = "interseek.cli:main"
interseek-benchmark = "interseek.benchmark:main"
interseek-study = "interseek.study:main"

[tool.setuptools]
packages = ["interseek"]
package-dir = {interseek = "src"}

[tool.setuptools.package-data]
interseek = ["study_sources.json"]
