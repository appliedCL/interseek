[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairloom"
version = "0.3.0"
description = "Paired protein learning with pretrained and random ESM-2 controls"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Reece Palmer"}]
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = ["torch>=2.3,<3", "transformers>=4.46,<6", "numpy>=1.24,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
test = []
docs = ["sphinx>=7"]

[project.scripts]
pairloom = "pairloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pairloom*"]
